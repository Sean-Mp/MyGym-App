<ion-content>
  <div class = "flex-center">
    <ion-card class = "forgot-card">
    <ion-card-header>
      <ion-card-title color = "danger">MyGym App</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <form (ngSubmit)="onForgotPassword()">
        <ion-item class = "forgot-card">
          <ion-label position="floating">Email</ion-label>
          <ion-input [(ngModel)]="email" name = "email" type = "text" required></ion-input>
          <p *ngIf = "userSuccess" class = "success-message">Password reset email sent!</p>
          <p *ngIf = "userError" class = "error-message">Invalid email</p>
          <p *ngIf = "serverError" class = "error-message">Server Error</p>
        </ion-item>
        <br>
        <ion-button type = "submit" color = "danger" size = "full">Reset password</ion-button>
        <ion-button color = "danger" fill = "clear" size = "full" (click)="onLogin()">Login</ion-button>
      </form>
    </ion-card-content>
    </ion-card>
  </div>
</ion-content>
